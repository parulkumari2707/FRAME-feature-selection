[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-feature-selector"
dynamic = ["version"]
description = "FRAME: A Hybrid Feature Selection Library Combining Forward Selection and RFE with XGBoost"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Parul Kumari", email = "parulkumari2707@gmail.com" },
]
keywords = [
    "feature-selection",
    "machine-learning",
    "sklearn",
    "xgboost",
    "forward-selection",
    "rfe",
    "hybrid",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.1",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "black",
]

[project.urls]
Homepage = "https://github.com/parulkumari2707/FRAME-FEATURE-SELECTOR"
"Bug Tracker" = "https://github.com/parulkumari2707/FRAME-FEATURE-SELECTOR/issues"
Documentation = "https://github.com/parulkumari2707/FRAME-FEATURE-SELECTOR#readme"

[tool.setuptools]
packages = ["frame"]

[tool.setuptools.dynamic]
version = { attr = "frame.version.__version__" }

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
